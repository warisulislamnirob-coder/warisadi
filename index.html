<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="description" content="warisadi — a private room for just two people.">
<meta name="theme-color" content="#14121c">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta property="og:title" content="warisadi">
<meta property="og:description" content="A private room for just two people.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%2314121c'/><circle cx='50' cy='50' r='42' fill='none' stroke='%232a2538' stroke-width='4'/><path d='M20 38 L80 38' stroke='%23c9a24b' stroke-width='6' stroke-linecap='round'/><path d='M50 38 L50 78' stroke='%23c9a24b' stroke-width='6' stroke-linecap='round'/><path d='M50 20 L61 31 L50 42 L39 31 Z' fill='%23e4c87a'/></svg>">
<title>warisadi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14121c;
    --surface:#1d1a26;
    --surface-raised:#262233;
    --surface-line:#332e42;
    --accent:#c9a24b;
    --accent-soft:#e4c87a;
    --text:#efebe3;
    --text-muted:#96909f;
    --online:#6fcf97;
    --warn:#d9705c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 600px at 50% -10%, rgba(201,162,75,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .serif{ font-family:'Fraunces', serif; }
  button{ font-family:inherit; cursor:pointer; }
  ::selection{ background:rgba(201,162,75,0.35); }
  :focus-visible{ outline:2px solid var(--accent-soft); outline-offset:2px; }

  /* ---------- App shell ---------- */
  #app{ height:100vh; height:100dvh; display:flex; flex-direction:column; }

  /* ---------- Login screen ---------- */
  .login-screen{
    flex:1; overflow-y:auto; padding:24px 16px 40px;
    display:flex; flex-direction:column; align-items:center; gap:22px;
  }
  .login-card,.rooms-panel{
    width:100%; max-width:380px;
    background:var(--surface);
    border:1px solid var(--surface-line);
    border-radius:18px;
    padding:36px 30px 30px;
    text-align:center;
  }
  .rooms-panel{ text-align:left; padding:18px 16px; }
  .rooms-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .rooms-title{ font-family:'Fraunces',serif; font-style:italic; font-size:18px; }
  .rooms-count{
    background:var(--surface-raised); border-radius:999px; font-size:11px;
    padding:2px 9px; color:var(--text-muted);
  }
  .room-row{
    display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:10px;
  }
  .room-row:hover{ background:var(--surface-raised); }
  .room-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .room-dot.empty{ background:var(--text-muted); }
  .room-dot.one{ background:var(--accent); }
  .room-dot.full{ background:var(--online); }
  .room-info{ flex:1; min-width:0; }
  .room-name{ font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .room-status{ font-size:11px; color:var(--text-muted); }
.room-del{
    flex-shrink:0; width:30px; height:30px; border-radius:8px;
    background:none; border:1px solid var(--surface-line); color:var(--warn);
    display:flex; align-items:center; justify-content:center;
  }
  .room-del:hover{ background:var(--warn); color:#fff; border-color:var(--warn); }
  .room-join,.room-open{
    flex-shrink:0; width:34px; height:30px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    background:none; border:1px solid var(--surface-line);
  }
  .room-join{ color:var(--accent-soft); }
  .room-join:hover{ background:var(--accent); color:#1a1508; border-color:var(--accent); }
  .room-open{ color:var(--warn); }
  .room-open:hover{ background:var(--warn); color:#fff; border-color:var(--warn); }
  .rooms-empty{ color:var(--text-muted); font-size:13px; text-align:center; padding:14px 0; }
  .rooms-hint{ font-size:11px; color:var(--text-muted); margin:12px 4px 2px; line-height:1.5; }
  .__p{ border-color:var(--warn); }
  .__t{ color:var(--warn); }
  .__s{ color:var(--text-muted); font-size:11px; margin:0 4px 10px; line-height:1.5; }
  .label-chip{ color:var(--accent-soft); font-size:11px; margin-left:6px; font-style:italic; }
  .v-tag{ color:var(--warn); font-size:10px; letter-spacing:0.08em; margin-left:6px; font-family:'Inter',sans-serif; }
  .v-banner{ background:rgba(217,112,92,0.12); color:var(--warn); font-size:12.5px; text-align:center; padding:8px 14px; border-bottom:1px solid var(--surface-line); }

  /* ---------- Join password menu ---------- */
  .pw-overlay{
    position:fixed; inset:0; background:rgba(10,9,14,0.6); z-index:40;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .pw-menu{
    width:100%; max-width:320px; background:var(--surface); border:1px solid var(--surface-line);
    border-radius:16px; padding:20px; box-shadow:0 12px 40px rgba(0,0,0,0.5);
  }
  .pw-title{ font-family:'Fraunces',serif; font-style:italic; font-size:16px; margin-bottom:12px; }
  .pw-menu input{
    width:100%; background:var(--surface-raised); border:1px solid var(--surface-line);
    border-radius:10px; padding:11px 12px; color:var(--text); font-size:15px; font-family:inherit;
  }
  .pw-menu input:focus{ border-color:var(--accent); outline:none; }
  .pw-err{ color:var(--warn); font-size:12.5px; min-height:16px; margin-top:8px; }
  .pw-actions{ display:flex; gap:8px; margin-top:10px; }
  .pw-actions button{
    flex:1; border-radius:10px; padding:11px; font-size:14px;
    border:1px solid var(--surface-line); background:var(--surface-raised); color:var(--text);
  }
  .pw-actions .pw-ok{ background:var(--accent); color:#1a1508; font-weight:600; border:none; }
  .pw-actions .pw-cancel:hover{ background:var(--surface-line); }

  /* ---------- Shared files ---------- */
  .file-msg{ display:flex; align-items:center; gap:10px; min-width:200px; }
  .file-msg .file-icon{ color:var(--accent-soft); flex-shrink:0; }
  .file-msg .file-info{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .file-msg .file-name{ font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .file-msg .file-size{ font-size:11px; opacity:.65; }
  .file-msg .dl-btn{
    flex-shrink:0; width:32px; height:32px; border-radius:8px; border:none;
    background:rgba(0,0,0,0.15); color:inherit; display:flex; align-items:center; justify-content:center;
  }
  .row.theirs .file-msg .dl-btn{ background:rgba(255,255,255,0.12); }
  .file-msg .dl-btn:hover{ background:var(--accent); color:#1a1508; }

  .wordmark{
    font-size:32px;
    font-style:italic;
    font-weight:400;
    letter-spacing:0.01em;
    color:var(--text);
    margin:0 0 6px;
  }
  .wordmark span{ color:var(--accent-soft); }
  .login-sub{
    color:var(--text-muted);
    font-size:14px;
    line-height:1.5;
    margin:0 0 28px;
  }
  .field{ text-align:left; margin-bottom:14px; }
  .field label{
    display:block; font-size:12.5px; color:var(--text-muted);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    background:var(--surface-raised);
    border:1px solid var(--surface-line);
    border-radius:10px;
    padding:12px 14px;
    color:var(--text);
    font-size:15px;
    font-family:inherit;
  }
  .field input:focus{ border-color:var(--accent); }
  .login-btn{
    width:100%;
    background:var(--accent);
    color:#1a1508;
    border:none;
    border-radius:10px;
    padding:13px;
    font-size:15px;
    font-weight:600;
    margin-top:10px;
    transition:background .15s ease;
  }
  .login-btn:hover{ background:var(--accent-soft); }
  .login-btn:disabled{ opacity:0.5; cursor:default; }
  .login-error{
    color:var(--warn); font-size:13px; margin-top:14px; min-height:16px;
  }
  .login-foot{
    color:var(--text-muted); font-size:11.5px; margin-top:22px; line-height:1.5;
  }

  /* ---------- Room screen ---------- */
  .room{ flex:1; display:flex; flex-direction:column; min-height:0; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px;
    background:var(--surface);
    border-bottom:1px solid var(--surface-line);
    flex-shrink:0;
  }
  .topbar-left{ display:flex; flex-direction:column; }
  .topbar-title{ font-family:'Fraunces',serif; font-style:italic; font-size:18px; }
  .topbar-status{
    font-size:12.5px; color:var(--text-muted); display:flex; align-items:center; gap:6px; margin-top:2px;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--text-muted); flex-shrink:0; }
  .dot.online{ background:var(--online); }
  .icon-btn{
    background:var(--surface-raised);
    border:1px solid var(--surface-line);
    border-radius:10px;
    width:40px; height:40px;
    display:flex; align-items:center; justify-content:center;
    color:var(--text);
    transition:background .15s ease, border-color .15s ease;
  }
  .icon-btn:hover{ background:var(--surface-line); }
  .icon-btn:active{ transform:scale(0.96); }
  .icon-btn.danger{ color:var(--warn); }

  .stream{
    flex:1; overflow-y:auto; padding:20px 16px;
    display:flex; flex-direction:column; gap:10px;
  }
  .empty-state{
    margin:auto; text-align:center; color:var(--text-muted); font-size:14px; max-width:260px; line-height:1.6;
  }
  .row{ display:flex; }
  .row.mine{ justify-content:flex-end; }
  .row.theirs{ justify-content:flex-start; }
  .bubble{
    max-width:75%;
    padding:10px 14px;
    border-radius:16px;
    font-size:14.5px;
    line-height:1.45;
    word-wrap:break-word;
    position:relative;
  }
  .row.mine .bubble{
    background:var(--accent);
    color:#1a1508;
    border-bottom-right-radius:4px;
  }
  .row.theirs .bubble{
    background:var(--surface-raised);
    color:var(--text);
    border:1px solid var(--surface-line);
    border-bottom-left-radius:4px;
  }
  .bubble.emoji-big{ font-size:38px; padding:4px 6px; background:transparent !important; border:none !important; }
  .msg-time{
    font-size:10.5px; opacity:0.55; margin-top:3px; display:block;
  }
  .voice-msg{ display:flex; align-items:center; gap:8px; min-width:170px; }
  .voice-msg button{
    width:30px; height:30px; border-radius:50%; border:none;
    background:rgba(0,0,0,0.15); color:inherit; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .row.theirs .voice-msg button{ background:rgba(255,255,255,0.08); }
  .voice-wave{ flex:1; height:20px; opacity:0.6; }

  .typing-indicator{ font-size:12.5px; color:var(--text-muted); padding:0 18px 6px; height:16px; }

  /* ---------- Input bar ---------- */
  .inputbar{
    flex-shrink:0;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--surface);
    border-top:1px solid var(--surface-line);
  }
  .emoji-row{
    display:flex; gap:6px; padding:2px 4px 10px; overflow-x:auto;
  }
  .emoji-row button{
    background:none; border:none; font-size:22px; padding:4px; flex-shrink:0; border-radius:8px;
  }
  .emoji-row button:hover{ background:var(--surface-raised); }
  .input-row{ display:flex; align-items:flex-end; gap:8px; }
  .input-row textarea{
    flex:1; resize:none;
    background:var(--surface-raised);
    border:1px solid var(--surface-line);
    border-radius:20px;
    padding:11px 16px;
    color:var(--text);
    font-family:inherit;
    font-size:15px;
    max-height:110px;
    line-height:1.4;
  }
  .input-row textarea:focus{ border-color:var(--accent); }
  .round-btn{
    flex-shrink:0; width:42px; height:42px; border-radius:50%;
    background:var(--surface-raised); border:1px solid var(--surface-line);
    display:flex; align-items:center; justify-content:center; color:var(--text);
  }
  .round-btn.send{ background:var(--accent); color:#1a1508; border:none; }
  .round-btn.send:disabled{ opacity:0.4; }
  .round-btn.recording{ background:var(--warn); color:#fff; border:none; animation:pulse 1.2s infinite; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(217,112,92,0.5);} 50%{ box-shadow:0 0 0 8px rgba(217,112,92,0);} }

  .footnote{
    text-align:center; font-size:10.5px; color:var(--text-muted); padding:8px 16px 2px;
  }

  /* ---------- Call overlays ---------- */
  .call-overlay{
    position:fixed; inset:0; background:rgba(10,9,14,0.92);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:50; padding:24px; text-align:center;
  }
  .call-overlay .ring-name{ font-family:'Fraunces',serif; font-style:italic; font-size:26px; margin-bottom:6px; }
  .call-overlay .ring-sub{ color:var(--text-muted); font-size:14px; margin-bottom:36px; }
  .call-actions{ display:flex; gap:22px; }
  .call-actions button{
    width:58px; height:58px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center;
  }
  .call-actions .accept{ background:var(--online); }
  .call-actions .decline{ background:var(--warn); }

  .video-stage{
    position:fixed; inset:0; background:#000; z-index:50;
    display:flex; align-items:center; justify-content:center;
  }
  .video-stage video{ width:100%; height:100%; object-fit:cover; }
  .video-stage .local-vid{
    position:absolute; width:100px; height:140px; bottom:100px; right:16px;
    border-radius:12px; object-fit:cover; border:2px solid rgba(255,255,255,0.2); z-index:2;
  }
  .video-controls{
    position:absolute; bottom:24px; left:0; right:0; display:flex; justify-content:center; gap:18px; z-index:3;
  }
  .video-controls button{
    width:52px; height:52px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.15); color:#fff; backdrop-filter:blur(6px);
  }
  .video-controls button.end{ background:var(--warn); }
  .call-status-banner{
    position:absolute; top:18px; left:0; right:0; text-align:center; color:#fff; font-size:13px; z-index:3;
  }
  .video-controls button.active{ background:var(--accent); color:#1a1508; }

  /* ---------- Chat extras ---------- */
  .unread-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent); margin-left:6px; vertical-align:middle; }
  .sender-divider{
    display:flex; align-items:center; gap:8px; margin:14px 4px 2px;
    font-size:11px; color:var(--text-muted); letter-spacing:0.08em; text-transform:uppercase;
  }
  .sender-divider > span:last-child{
    font-family:'Fraunces',serif; font-style:italic; font-size:13.5px;
    letter-spacing:0; text-transform:none; color:var(--text);
  }
  .sender-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .day-divider{
    display:flex; align-items:center; gap:12px; margin:16px 4px; color:var(--text-muted);
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
  }
  .day-divider::before,.day-divider::after{ content:''; flex:1; height:1px; background:var(--surface-line); }
  .new-divider{
    display:flex; align-items:center; gap:12px; margin:16px 4px; color:var(--accent);
    font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase;
  }
  .new-divider::before,.new-divider::after{ content:''; flex:1; height:1px; background:var(--accent); opacity:0.35; }
  .read-mark{ color:var(--accent); font-size:10px; margin-left:4px; vertical-align:middle; }
  .msg-actions{ display:flex; flex-direction:column; gap:4px; padding-left:4px; }
  .mini-btn{
    width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    background:none; border:1px solid var(--surface-line); color:var(--text-muted); font-size:12px;
  }
  .mini-btn:hover{ background:var(--surface-raised); color:var(--text); }
  .mini-btn.danger:hover{ background:var(--warn); color:#fff; border-color:var(--warn); }
  .edited-tag{ font-size:10px; color:var(--text-muted); font-style:italic; }
  .file-thumb{
    display:inline-block; width:58px; height:58px; border-radius:10px; object-fit:cover;
    border:1px solid var(--surface-line); margin:2px 0 6px;
  }
  .load-earlier{
    display:block; margin:4px auto 10px; background:none; border:1px dashed var(--surface-line);
    color:var(--text-muted); border-radius:999px; padding:7px 18px; font-size:12.5px; font-family:inherit;
  }
  .load-earlier:hover{ border-color:var(--accent); color:var(--accent-soft); }
  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(10px);
    background:rgba(24,22,32,0.95); color:var(--text); border:1px solid var(--surface-line);
    padding:8px 18px; border-radius:999px; font-size:13px; z-index:60; opacity:0;
    transition:opacity .2s,transform .2s; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:480px){
    .bubble{ max-width:85%; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="callRoot"></div>

<!-- Firebase (Realtime Database) — the shared store that lets 2 people on different devices connect -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics-compat.js"></script>
