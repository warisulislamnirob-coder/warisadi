<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="description" content="warisadi — a private room for just two people.">
<meta name="theme-color" content="#14121c">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta property="og:title" content="warisadi">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --bg:#14121c;
    --surface:#1d1a26;
    --surface-raised:#262233;
    --surface-line:#332e42;
    --accent:#c9a24b;
    --accent-soft:#e4c87a;
    --text:#efebe3;
    --text-muted:#96909f;
    --online:#6fcf97;
    --warn:#d9705c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 600px at 50% -10%, rgba(201,162,75,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .serif{ font-family:'Fraunces', serif; }
  button{ font-family:inherit; cursor:pointer; }
  ::selection{ background:rgba(201,162,75,0.35); }
  :focus-visible{ outline:2px solid var(--accent-soft); outline-offset:2px; }

  /* ---------- App shell ---------- */
  #app{ height:100vh; height:100dvh; display:flex; flex-direction:column; }

  /* ---------- Login screen ---------- */
  .login-wrap{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .login-card{
    width:100%; max-width:380px;
    background:var(--surface);
    border:1px solid var(--surface-line);
    border-radius:18px;
    padding:36px 30px 30px;
    text-align:center;
  }
  .wordmark{
    font-size:32px;
    font-style:italic;
    font-weight:400;
    letter-spacing:0.01em;
    color:var(--text);
    margin:0 0 6px;
  }
  .wordmark span{ color:var(--accent-soft); }
  .login-sub{
    color:var(--text-muted);
    font-size:14px;
    line-height:1.5;
    margin:0 0 28px;
  }
  .field{ text-align:left; margin-bottom:14px; }
  .field label{
    display:block; font-size:12.5px; color:var(--text-muted);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    background:var(--surface-raised);
    border:1px solid var(--surface-line);
    border-radius:10px;
    padding:12px 14px;
    color:var(--text);
    font-size:15px;
    font-family:inherit;
  }
  .field input:focus{ border-color:var(--accent); }
  .login-btn{
    width:100%;
    background:var(--accent);
    color:#1a1508;
    border:none;
    border-radius:10px;
    padding:13px;
    font-size:15px;
    font-weight:600;
    margin-top:10px;
    transition:background .15s ease;
  }
  .login-btn:hover{ background:var(--accent-soft); }
  .login-btn:disabled{ opacity:0.5; cursor:default; }
  .login-error{
    color:var(--warn); font-size:13px; margin-top:14px; min-height:16px;
  }
  .login-foot{
    color:var(--text-muted); font-size:11.5px; margin-top:22px; line-height:1.5;
  }

  /* ---------- Room screen ---------- */
  .room{ flex:1; display:flex; flex-direction:column; min-height:0; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px;
    background:var(--surface);
    border-bottom:1px solid var(--surface-line);
    flex-shrink:0;
  }
  .topbar-left{ display:flex; flex-direction:column; }
  .topbar-title{ font-family:'Fraunces',serif; font-style:italic; font-size:18px; }
  .topbar-status{
    font-size:12.5px; color:var(--text-muted); display:flex; align-items:center; gap:6px; margin-top:2px;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--text-muted); flex-shrink:0; }
  .dot.online{ background:var(--online); }
  .icon-btn{
    background:var(--surface-raised);
    border:1px solid var(--surface-line);
    border-radius:10px;
    width:40px; height:40px;
    display:flex; align-items:center; justify-content:center;
    color:var(--text);
    transition:background .15s ease, border-color .15s ease;
  }
  .icon-btn:hover{ background:var(--surface-line); }
  .icon-btn:active{ transform:scale(0.96); }
  .icon-btn.danger{ color:var(--warn); }

  .stream{
    flex:1; overflow-y:auto; padding:20px 16px;
    display:flex; flex-direction:column; gap:10px;
  }
  .empty-state{
    margin:auto; text-align:center; color:var(--text-muted); font-size:14px; max-width:260px; line-height:1.6;
  }
  .row{ display:flex; }
  .row.mine{ justify-content:flex-end; }
  .row.theirs{ justify-content:flex-start; }
  .bubble{
    max-width:75%;
    padding:10px 14px;
    border-radius:16px;
    font-size:14.5px;
    line-height:1.45;
    word-wrap:break-word;
    position:relative;
  }
  .row.mine .bubble{
    background:var(--accent);
    color:#1a1508;
    border-bottom-right-radius:4px;
  }
  .row.theirs .bubble{
    background:var(--surface-raised);
    color:var(--text);
    border:1px solid var(--surface-line);
    border-bottom-left-radius:4px;
  }
  .bubble.emoji-big{ font-size:38px; padding:4px 6px; background:transparent !important; border:none !important; }
  .msg-time{
    font-size:10.5px; opacity:0.55; margin-top:3px; display:block;
  }
  .voice-msg{ display:flex; align-items:center; gap:8px; min-width:170px; }
  .voice-msg button{
    width:30px; height:30px; border-radius:50%; border:none;
    background:rgba(0,0,0,0.15); color:inherit; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .row.theirs .voice-msg button{ background:rgba(255,255,255,0.08); }
  .voice-wave{ flex:1; height:20px; opacity:0.6; }

  .typing-indicator{ font-size:12.5px; color:var(--text-muted); padding:0 18px 6px; height:16px; }

  /* ---------- Input bar ---------- */
  .inputbar{
    flex-shrink:0;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--surface);
    border-top:1px solid var(--surface-line);
  }
  .emoji-row{
    display:flex; gap:6px; padding:2px 4px 10px; overflow-x:auto;
  }
  .emoji-row button{
    background:none; border:none; font-size:22px; padding:4px; flex-shrink:0; border-radius:8px;
  }
  .emoji-row button:hover{ background:var(--surface-raised); }
  .input-row{ display:flex; align-items:flex-end; gap:8px; }
  .input-row textarea{
    flex:1; resize:none;
    background:var(--surface-raised);
    border:1px solid var(--surface-line);
    border-radius:20px;
    padding:11px 16px;
    color:var(--text);
    font-family:inherit;
    font-size:15px;
    max-height:110px;
    line-height:1.4;
  }
  .input-row textarea:focus{ border-color:var(--accent); }
  .round-btn{
    flex-shrink:0; width:42px; height:42px; border-radius:50%;
    background:var(--surface-raised); border:1px solid var(--surface-line);
    display:flex; align-items:center; justify-content:center; color:var(--text);
  }
  .round-btn.send{ background:var(--accent); color:#1a1508; border:none; }
  .round-btn.send:disabled{ opacity:0.4; }
  .round-btn.recording{ background:var(--warn); color:#fff; border:none; animation:pulse 1.2s infinite; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(217,112,92,0.5);} 50%{ box-shadow:0 0 0 8px rgba(217,112,92,0);} }

  .footnote{
    text-align:center; font-size:10.5px; color:var(--text-muted); padding:8px 16px 2px;
  }

  /* ---------- Call overlays ---------- */
  .call-overlay{
    position:fixed; inset:0; background:rgba(10,9,14,0.92);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:50; padding:24px; text-align:center;
  }
  .call-overlay .ring-name{ font-family:'Fraunces',serif; font-style:italic; font-size:26px; margin-bottom:6px; }
  .call-overlay .ring-sub{ color:var(--text-muted); font-size:14px; margin-bottom:36px; }
  .call-actions{ display:flex; gap:22px; }
  .call-actions button{
    width:58px; height:58px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center;
  }
  .call-actions .accept{ background:var(--online); }
  .call-actions .decline{ background:var(--warn); }

  .video-stage{
    position:fixed; inset:0; background:#000; z-index:50;
    display:flex; align-items:center; justify-content:center;
  }
  .video-stage video{ width:100%; height:100%; object-fit:cover; }
  .video-stage .local-vid{
    position:absolute; width:100px; height:140px; bottom:100px; right:16px;
    border-radius:12px; object-fit:cover; border:2px solid rgba(255,255,255,0.2); z-index:2;
  }
  .video-controls{
    position:absolute; bottom:24px; left:0; right:0; display:flex; justify-content:center; gap:18px; z-index:3;
  }
  .video-controls button{
    width:52px; height:52px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.15); color:#fff; backdrop-filter:blur(6px);
  }
  .video-controls button.end{ background:var(--warn); }
  .call-status-banner{
    position:absolute; top:18px; left:0; right:0; text-align:center; color:#fff; font-size:13px; z-index:3;
  }

  @media (max-width:480px){
    .bubble{ max-width:85%; }
  }
</style>
</head>

<script>
(function(){

/* ================= Storage helpers ================= */
let fbDb = null;
function firebaseConfigured(){
  try{
    return !!(typeof firebase !== 'undefined' && typeof FIREBASE_CONFIG !== 'undefined' &&
      FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf('YOUR_') !== 0);
  }catch(e){ return false; }
}
function firebaseInit(){
  if(!firebaseConfigured()) return;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    fbDb = firebase.database();
    try{ firebase.analytics(); }catch(e){}
  }catch(e){
    try{ if(firebase.app()) fbDb = firebase.database(); }catch(e2){ fbDb = null; }
  }
}
firebaseInit();
function fbRef(key){ return fbDb.ref(key.split(':').join('/')); }

function useBridge(){
  return !!(window && window.storage && typeof window.storage.get==='function' && typeof window.storage.set==='function');
}
const LS_PREFIX = 'warisadi:';
async function sGet(key, shared){
  try{
    if(fbDb){
      const snap = await fbRef(key).get();
      return snap.exists() ? snap.val() : null;
    }
    if(useBridge()){
      const r = await window.storage.get(key, shared);
      if(!r) return null;
      return JSON.parse(r.value);
    }
    const raw = window.localStorage.getItem(LS_PREFIX + key);
    return raw === null ? null : JSON.parse(raw);
  }catch(e){ return null; }
}
async function sSet(key, value, shared){
  try{
    if(fbDb){
      await fbRef(key).set(value);
      return true;
    }
    const json = JSON.stringify(value);
    if(useBridge()){
      await window.storage.set(key, json, shared);
    }else{
      window.localStorage.setItem(LS_PREFIX + key, json);
    }
    return true;
  }catch(e){ return false; }
}

/* ================= Small utils ================= */
function storageAvailable(){
  if(fbDb) return true;
  if(useBridge()) return true;
  try{
    window.localStorage.setItem(LS_PREFIX + 'probe', '1');
    window.localStorage.removeItem(LS_PREFIX + 'probe');
    return true;
  }catch(e){ return false; }
}
async function hashRoom(str){
  try{
    if(window.crypto && window.crypto.subtle){
      const data = new TextEncoder().encode('warisadi:'+str);
      const buf = await window.crypto.subtle.digest('SHA-256', data);
      const bytes = new Uint8Array(buf);
      let hex='';
      for(let i=0;i<8;i++) hex += bytes[i].toString(16).padStart(2,'0');
      return 'room_' + hex;
    }
  }catch(e){}
  // cyrb53 fallback (secure context unavailable)
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i=0;i<str.length;i++){
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
  h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909);
  return 'room_' + (h2>>>0).toString(16).padStart(8,'0') + (h1>>>0).toString(16).padStart(8,'0');
}
function uid(){ return 'u_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function msgId(){ return 'm_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function nowTs(){ return Date.now(); }
function fmtTime(ts){
  const d = new Date(ts);
  let h = d.getHours(); const m = d.getMinutes();
  const ampm = h>=12 ? 'PM':'AM';
  h = h%12; if(h===0) h=12;
  return h+':'+String(m).padStart(2,'0')+' '+ampm;
}
function isEmojiOnly(str){
  const trimmed = str.trim();
  if(!trimmed || trimmed.length>12) return false;
  return /^(\p{Extended_Pictographic}|\s)+$/u.test(trimmed);
}
function escapeHtml(str){
  const d = document.createElement('div'); d.textContent = str; return d.innerHTML;
}

/* ================= Icons ================= */
const ICONS = {
  send: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>',

  video: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>',

  phoneOff: '<svg width="24" height="24" viewBox="0 0 24 24" fill="white" stroke="none"><path d="M22 2 2 22" stroke="white" stroke-width="2"/><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z"/></svg>',

  play: '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
  pause: '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>',
};

const QUICK_EMOJI = ['❤️','😂','😍','😢','😮','🔥','👍','🙏','🎉','😘','🥺','😅'];

/* ================= App State ================= */
const state = {
  screen: 'login',
  loginError: '',
  loginBusy: false,
  myId: null,
  myName: '',
  roomId: null,
  password: '',
  otherName: null,
  otherOnline: false,
  otherTyping: false,
  messages: [],
  lastMsgSignature: '',
  showEmojiRow: false,

  callPhase: 'idle', // idle | ringing-out | ringing-in | active

let presenceTimer=null, msgTimer=null, callTimer=null, recTimer=null;

let pc=null, localStream=null, remoteStream=null;
let candidateProgress = {caller:0, callee:0};

function render(){
  const app = document.getElementById('app');
  const el = document.getElementById('textInput');
  const keepComposer = !!(el && document.activeElement===el);
  if(keepComposer){
    state.draft = el.value;
    state.composerCaret = el.selectionStart || 0;
  }
  if(state.screen==='login'){ app.innerHTML = renderLogin(); bindLogin(); }
  else{ app.innerHTML = renderRoom(); bindRoom(keepComposer); }
}

/* ================= LOGIN SCREEN ================= */
function renderLogin(){
  return `
  <div class="login-wrap">
    <div class="login-card">
      <p class="wordmark">waris<span>adi</span></p>
      <p class="login-sub">A private room for just two people.<br>Enter the same password to connect.</p>
      <div class="field">
        <label for="nameInput">Your name</label>
        <input id="nameInput" type="text" maxlength="20" placeholder="e.g. Adi" value="${escapeHtml(state.myName)}">
      </div>
      <div class="field">
        <label for="passInput">Room password</label>
        <input id="passInput" type="password" maxlength="60" placeholder="Shared password" value="${escapeHtml(state.password)}">
      </div>
      <button class="login-btn" id="joinBtn" ${state.loginBusy?'disabled':''}>${state.loginBusy?'Connecting…':'Connect'}</button>
      <div class="login-error">${escapeHtml(state.loginError)}</div>
      <p class="login-foot">Only two people can be in a room at once. Anyone with the link and password can join — pick a password only the two of you know.</p>
      ${useBridge() ? '' :
      (fbDb
        ? '<p class="login-foot" style="color:var(--online);">Connected to Firebase — rooms work across devices.</p>'
        : '<p class="login-foot" style="color:var(--warn);">Firebase not configured: chat works on this device only. Paste your config in FIREBASE_CONFIG above to enable cross-device rooms.</p>')}
    </div>
  </div>`;
}

function bindLogin(){
  const nameInput = document.getElementById('nameInput');
  const passInput = document.getElementById('passInput');
  const joinBtn = document.getElementById('joinBtn');
  nameInput.oninput = e=> state.myName = e.target.value;
  passInput.oninput = e=> state.password = e.target.value;
  passInput.onkeydown = e=>{ if(e.key==='Enter') attemptJoin(); };
  nameInput.onkeydown = e=>{ if(e.key==='Enter') passInput.focus(); };
  joinBtn.onclick = attemptJoin;
  nameInput.focus();
}

async function attemptJoin(){
  if(!storageAvailable()){
    state.loginError = 'Storage is unavailable in this browser (no storage bridge and no localStorage) — this app cannot run here.';
    render();
    return;
  }
  const name = state.myName.trim();
  const pass = state.password.trim();
  if(!name){ state.loginError = 'Enter a name so the other person knows it\'s you.'; render(); return; }
  if(!pass){ state.loginError = 'Enter the room password.'; render(); return; }
  state.loginBusy = true; state.loginError=''; render();

  const roomId = await hashRoom(pass);
  const presKey = `warisadi:${roomId}:presence`;
  if(!state.myId) state.myId = uid();
  const cutoff = nowTs() - 15000;

  let joined = false;
  for(let attempt=0; attempt<3 && !joined; attempt++){
    let presence = await sGet(presKey, true) || {};
    // prune stale members
    Object.keys(presence).forEach(id=>{ if(presence[id].lastSeen < cutoff) delete presence[id]; });

    const activeOthers = Object.keys(presence).filter(id=> id!==state.myId && presence[id].lastSeen > cutoff);
    if(activeOthers.length >= 2){
      state.loginBusy = false;
      state.loginError = 'This room already has two people in it. Try again in a moment, or use a different password.';
      render();
      return;
    }

    presence[state.myId] = { name, lastSeen: nowTs(), typing:false };
    await sSet(presKey, presence, true);

    // verify no one else claimed the last seat between our read and write
    const check = await sGet(presKey, true) || {};
    const liveIds = Object.keys(check).filter(id=> check[id].lastSeen > cutoff);
    if(liveIds.length <= 2){ joined = true; break; }

    // room got overcrowded by a concurrent joiner — deterministically evict the
    // entry with the largest id (never this one's if the other claimed it).
    if(state.myId === liveIds.reduce((a,b)=> a>b?a:b)){
      delete check[state.myId];
      await sSet(presKey, check, true);
    }
  }

  if(!joined){
    state.loginBusy = false;
    state.loginError = 'Two people were already in this room. Try a different password or wait a moment.';
    render();
    return;
  }

  state.roomId = roomId;
  state.screen = 'room';
  state.loginBusy = false;
  render();
  startPolling();
}

    <div class="topbar">

        <div class="topbar-title">${escapeHtml(other)}</div>

      </div>
      <div class="topbar-actions" style="display:flex; gap:8px;">
        <button class="icon-btn" id="callBtn" title="Start video call" ${!state.otherName?'disabled':''}>${ICONS.video}</button>
        <button class="icon-btn" id="leaveBtn" title="Leave room" style="color:var(--text-muted);">${ICONS.leave}</button>
      </div>
    </div>

    <div class="stream" id="stream">
      ${state.messages.length===0 ? `<div class="empty-state">This is the start of your private room.<br>Say hello 👋</div>` : state.messages.map(renderMessage).join('')}
    </div>

      <div class="input-row">

        <button class="round-btn send" id="sendBtn" disabled>${ICONS.send}</button>

  </div>

}

function renderMessage(m){
  const mine = m.sender === state.myId;
  const row = mine ? 'mine' : 'theirs';
  let inner = '';
  if(m.type==='voice'){
    inner = `<div class="bubble"><div class="voice-msg">
      <button data-play="${m.id}">${state.playingId===m.id ? ICONS.pause : ICONS.play}</button>
      <svg class="voice-wave" viewBox="0 0 100 20" preserveAspectRatio="none">${voiceBars()}</svg>
      <span style="font-size:11px;opacity:.7">${m.duration?m.duration+'s':''}</span>
    </div><span class="msg-time">${fmtTime(m.ts)}</span></div>`;
  } else if(m.emojiOnly){
    inner = `<div class="bubble emoji-big">${escapeHtml(m.content)}</div>`;
  } else {
    inner = `<div class="bubble">${escapeHtml(m.content).replace(/\n/g,'<br>')}<span class="msg-time">${fmtTime(m.ts)}</span></div>`;
  }
  return `<div class="row ${row}">${inner}</div>`;
}

function voiceBars(){
  let bars='';
  for(let i=0;i<24;i++){
    const h = 4 + Math.abs(Math.sin(i*1.3))*14;
    bars += `<rect x="${i*4.2}" y="${10-h/2}" width="2.4" height="${h}" fill="currentColor" rx="1"></rect>`;
  }
  return bars;
}

  if(state.callPhase==='idle') return '';

      <div class="ring-sub">${state.callError? escapeHtml(state.callError) : 'Ringing…'}</div>
      <div class="call-actions"><button class="decline" id="cancelCallBtn">${ICONS.phoneOff}</button></div>
    </div>`;
  }
  if(state.callPhase==='ringing-in'){

      <div class="ring-sub">Incoming video call</div>
      <div class="call-actions">
        <button class="accept" id="acceptCallBtn">${ICONS.phone}</button>
        <button class="decline" id="declineCallBtn">${ICONS.phoneOff}</button>

function bindRoom(keepComposer){
  const streamEl = document.getElementById('stream');
  if(streamEl){
    streamEl.onscroll = ()=>{ scrollStick = streamEl.scrollHeight - streamEl.scrollTop - streamEl.clientHeight < 60; };
    if(scrollStick) streamEl.scrollTop = streamEl.scrollHeight;
  }

  const textInput = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');
  const emojiToggle = document.getElementById('emojiToggle');
  const micBtn = document.getElementById('micBtn');
  const callBtn = document.getElementById('callBtn');

  if(textInput){
    textInput.oninput = ()=>{
      state.draft = textInput.value;
      state.composerCaret = textInput.selectionStart || 0;
      sendBtn.disabled = textInput.value.trim().length===0;
      textInput.style.height='auto'; textInput.style.height = Math.min(textInput.scrollHeight,110)+'px';
      setTyping(textInput.value.trim().length>0);
    };
    textInput.onkeydown = e=>{
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendText(); }
    };
    textInput.onblur = ()=> setTyping(false);
    textInput.value = state.draft;
    textInput.style.height='auto'; textInput.style.height = Math.min(textInput.scrollHeight,110)+'px';
    if(keepComposer){
      const pos = Math.min(state.composerCaret || textInput.value.length, textInput.value.length);
      textInput.setSelectionRange(pos,pos);
      textInput.focus();
    }
  }
  if(sendBtn) sendBtn.onclick = sendText;
  if(emojiToggle) emojiToggle.onclick = ()=>{ state.showEmojiRow = !state.showEmojiRow; render(); };
  document.querySelectorAll('[data-emoji]').forEach(b=>{
    b.onclick = ()=>{
      const ti = document.getElementById('textInput');
      ti.value += b.dataset.emoji;
      ti.dispatchEvent(new Event('input'));
      ti.focus();
    };
  });

  if(micBtn){
    const start = e=>{ e.preventDefault(); startRecording(); };
    const stop = e=>{ e.preventDefault(); stopRecording(); };
    micBtn.addEventListener('pointerdown', start);
    micBtn.addEventListener('pointerup', stop);
    micBtn.addEventListener('pointercancel', stop);
    micBtn.addEventListener('pointerleave', ()=>{ if(state.isRecording) stopRecording(); });
  }

  if(callBtn) callBtn.onclick = startCall;
  const leaveBtn = document.getElementById('leaveBtn');
  if(leaveBtn) leaveBtn.onclick = leaveRoom;

  document.querySelectorAll('[data-play]').forEach(b=>{
    b.onclick = ()=> togglePlay(b.dataset.play);
  });

  // call layer bindings
  const cancelBtn = document.getElementById('cancelCallBtn');
  if(cancelBtn) cancelBtn.onclick = ()=> endCall('You ended the call.');
  const acceptBtn = document.getElementById('acceptCallBtn');
  if(acceptBtn) acceptBtn.onclick = acceptIncomingCall;
  const declineBtn = document.getElementById('declineCallBtn');
  if(declineBtn) declineBtn.onclick = ()=> declineCall();
  const endBtn = document.getElementById('endCallBtn');
  if(endBtn) endBtn.onclick = ()=> endCall('Call ended.');
  const toggleMicBtn = document.getElementById('toggleMicBtn');
  if(toggleMicBtn) toggleMicBtn.onclick = toggleCallMic;
  const toggleCamBtn = document.getElementById('toggleCamBtn');
  if(toggleCamBtn) toggleCamBtn.onclick = toggleCallCam;

  if(state.callPhase==='active'){
    const lv = document.getElementById('localVideo');
    const rv = document.getElementById('remoteVideo');
    if(lv && localStream) lv.srcObject = localStream;
    if(rv && remoteStream) rv.srcObject = remoteStream;
  }
}

/* ================= Messaging ================= */
function cleanupOrphanedVoices(oldMsgs, newMsgs){
  if(!state.roomId || !oldMsgs || oldMsgs.length === 0) return;
  const keep = new Set(newMsgs.map(m=> m.id));
  const orphaned = oldMsgs.filter(m=> m.type==='voice' && !keep.has(m.id));
  for(const m of orphaned) sSet(`warisadi:${state.roomId}:voice:${m.id}`, null, true);
}

async function setTyping(isTyping){
  const presKey = `warisadi:${state.roomId}:presence`;
  const presence = await sGet(presKey, true) || {};
  if(!presence[state.myId]) presence[state.myId] = {};
  presence[state.myId].name = state.myName;
  presence[state.myId].lastSeen = nowTs();
  presence[state.myId].typing = isTyping;
  await sSet(presKey, presence, true);
}

async function sendText(){
  const text = state.draft.trim();
  if(!text) return;
  state.draft=''; state.composerCaret=0;
  document.getElementById('textInput').value='';
  document.getElementById('textInput').style.height='auto';
  document.getElementById('sendBtn').disabled = true;
  await pushMessage({ id: msgId(), sender: state.myId, name: state.myName, type:'text', content: text, emojiOnly: isEmojiOnly(text), ts: nowTs() });
  setTyping(false);
}

async function pushMessage(m){
  const key = `warisadi:${state.roomId}:messages`;
  for(let attempt=0; attempt<3; attempt++){
    const list = await sGet(key, true) || [];
    if(list.some(x=> x.id===m.id)) break;
    const trimmed = list.concat([m]).slice(-300);
    await sSet(key, trimmed, true);
    const check = await sGet(key, true) || [];
    const deduped = dedupeBy(check).slice(-300);
    if(deduped.some(x=> x.id===m.id)){
      cleanupOrphanedVoices(state.messages, deduped);
      state.messages = deduped;
      scrollStick = true;
      render();
      return;
    }
  }
}

function dedupeBy(list){
  const seen = new Set(), out = [];
  for(let i=0;i<list.length;i++){
    const m = list[i];
    if(!m || seen.has(m.id)) continue;
    seen.add(m.id);
    out.push(m);
  }
  return out;
}

async function pollMessages(){
  if(!state.roomId) return;
  const key = `warisadi:${state.roomId}:messages`;
  const list = dedupeBy(await sGet(key, true) || []);
  const sig = list.length + '_' + (list.length?list[list.length-1].id:'');
  if(sig !== state.lastMsgSignature){
    state.lastMsgSignature = sig;
    cleanupOrphanedVoices(state.messages, list);
    state.messages = list;
    render();
  }
}

async function pollPresence(){
  if(!state.roomId) return;
  const key = `warisadi:${state.roomId}:presence`;
  const presence = await sGet(key, true) || {};
  presence[state.myId] = presence[state.myId] || {};
  presence[state.myId].name = state.myName;
  presence[state.myId].lastSeen = nowTs();
  await sSet(key, presence, true);

  const cutoff = nowTs() - 9000;
  const otherEntry = Object.entries(presence).find(([id])=> id!==state.myId && presence[id].lastSeen > cutoff);
  let changed = false;
  if(otherEntry){
    const info = otherEntry[1];
    changed = state.otherName !== info.name || state.otherOnline !== (info.lastSeen>cutoff) || state.otherTyping !== !!info.typing;
    state.otherName = info.name;
    state.otherOnline = info.lastSeen > cutoff;
    state.otherTyping = !!info.typing;
  } else if(state.otherName || state.otherOnline || state.otherTyping){
    state.otherName = null;
    state.otherOnline = false;
    state.otherTyping = false;
    changed = true;
  }
  if(changed) render();
}

function startPolling(){
  pollPresence(); pollMessages();
  presenceTimer = setInterval(pollPresence, 3000);
  msgTimer = setInterval(pollMessages, 2000);
  callTimer = setInterval(pollCall, 1500);
}

function stopPolling(){
  if(presenceTimer) clearInterval(presenceTimer);
  if(msgTimer) clearInterval(msgTimer);
  if(callTimer) clearInterval(callTimer);
  presenceTimer = msgTimer = callTimer = null;
}

async function clearPresence(){
  if(!state.roomId) return;
  const presKey = `warisadi:${state.roomId}:presence`;
  const presence = await sGet(presKey, true) || {};
  delete presence[state.myId];
  await sSet(presKey, presence, true);
}

async function leaveRoom(){
  if(state.isRecording) stopRecording();
  if(state.callPhase!=='idle') endCall('You left the room.');
  await clearPresence();
  stopPolling();
  if(audioEl){ audioEl.pause(); audioEl=null; }
  teardownCall();
  state.otherName=null; state.otherOnline=false; state.otherTyping=false;
  state.messages=[]; state.lastMsgSignature='';
  state.roomId=null; state.draft=''; state.composerCaret=0;
  state.showEmojiRow=false; state.audioCache={}; state.playingId=null;
  state.screen='login'; state.loginBusy=false; state.loginError='';
  render();
}

window.addEventListener('pagehide', ()=>{ if(state.roomId) clearPresence(); });

/* ================= Voice messages ================= */
async function startRecording(){
  if(state.isRecording) return;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    recChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e=>{ if(e.data.size>0) recChunks.push(e.data); };
    mediaRecorder.onstop = async ()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob = new Blob(recChunks, {type: mediaRecorder.mimeType || 'audio/webm'});
      const durationSec = Math.max(1, Math.round((Date.now()-recStartedAt)/1000));
      if(blob.size > 0 && durationSec <= 60){
        const base64 = await blobToBase64(blob);
        if(base64.length > 1_600_000){
          alert('That voice message was too large to save. Try a shorter one.');
          return;
        }
        const id = msgId();
        const ok = await sSet(`warisadi:${state.roomId}:voice:${id}`, {audio: base64, mime: blob.type}, true);
        if(ok){
          await pushMessage({ id, sender: state.myId, name: state.myName, type:'voice', content: id, duration: durationSec, ts: nowTs() });
        }
      }
    };
    mediaRecorder.start();
    recStartedAt = Date.now();
    state.isRecording = true;
    render();
  }catch(e){
    alert('Could not access your microphone. Check your browser permissions.');
  }
}
function stopRecording(){
  if(!state.isRecording) return;
  state.isRecording = false;
  if(mediaRecorder && mediaRecorder.state!=='inactive') mediaRecorder.stop();
  render();
}
function blobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

let audioEl = null;
async function togglePlay(id){
  if(state.playingId === id){
    if(audioEl) audioEl.pause();
    state.playingId = null; render(); return;
  }
  if(audioEl){ audioEl.pause(); }
  let data = state.audioCache[id];
  if(!data){
    data = await sGet(`warisadi:${state.roomId}:voice:${id}`, true);
    if(data) state.audioCache[id] = data;
  }
  if(!data){ alert('This voice message could not be loaded.'); return; }
  audioEl = new Audio(data.audio);
  audioEl.onended = ()=>{ state.playingId=null; render(); };
  audioEl.play();
  state.playingId = id;
  render();
}

/* ================= Video calling (WebRTC + storage signaling) ================= */
const ICE_SERVERS = [
  {urls:'stun:stun.l.google.com:19302'},
  {urls:'stun:stun1.l.google.com:19302'},
  {urls:'stun:stun.cloudflare.com:3478'},
  {urls:'turn:openrelay.metered.ca:80', username:'openrelayproject', credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443', username:'openrelayproject', credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:80?transport=tcp', username:'openrelayproject', credential:'openrelayproject'}
];
const RING_TIMEOUT = 30000;

function callKey(){ return `warisadi:${state.roomId}:call`; }

function newPeerConnection(role){
  const conn = new RTCPeerConnection({iceServers: ICE_SERVERS});
  conn.onicecandidate = async (e)=>{
    if(!e.candidate) return;
    const call = await sGet(callKey(), true);
    if(!call) return;
    const field = role==='caller' ? 'candidatesCaller' : 'candidatesCallee';
    call[field] = call[field] || [];
    call[field].push(e.candidate.toJSON());
    await sSet(callKey(), call, true);
  };
  conn.ontrack = (e)=>{
    remoteStream = e.streams[0];
    const rv = document.getElementById('remoteVideo');
    if(rv) rv.srcObject = remoteStream;
  };
  conn.onconnectionstatechange = ()=>{
    if(conn.connectionState === 'failed'){
      state.callError = 'Could not establish a direct connection — this can happen on some mobile or office networks.';
      render();
    }
  };
  return conn;
}

async function startCall(){
  if(state.callPhase!=='idle' || !state.otherName) return;
  isCaller = true;
  candidateProgress = {caller:0, callee:0};
  try{
    localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
  }catch(e){
    alert('Could not access your camera/microphone.'); return;
  }
  pc = newPeerConnection('caller');
  localStream.getTracks().forEach(t=> pc.addTrack(t, localStream));
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await sSet(callKey(), {
    status:'ringing', caller: state.myId, callerName: state.myName,
    callee: null, offer: offer, answer: null,
    candidatesCaller: [], candidatesCallee: []
  }, true);

  state.callPhase = 'ringing-out';
  state.callPeerName = state.otherName;
  state.callError = '';
  state.ringStartedAt = nowTs();
  render();
}

async function pollCall(){
  if(!state.roomId) return;
  const call = await sGet(callKey(), true);

  if(!call || call.status==='ended'){
    if(state.callPhase!=='idle'){
      teardownCall(call && call.endedReason ? call.endedReason : 'Call ended.');
    }
    return;
  }

  // Incoming call detection
  if(call.status==='ringing' && call.caller!==state.myId && state.callPhase==='idle'){
    state.callPhase='ringing-in';
    state.callPeerName = call.callerName || 'Someone';
    render();
    return;
  }

  // Caller sees answer
  if(isCaller && state.callPhase==='ringing-out' && call.answer && pc && !pc.currentRemoteDescription){
    await pc.setRemoteDescription(new RTCSessionDescription(call.answer));
    state.callPhase='active';
    state.callError='';
    render();
  }

  // Automatic ringing timeout
  if(isCaller && state.callPhase==='ringing-out' && nowTs() - state.ringStartedAt > RING_TIMEOUT){
    endCall('No answer — call ended.');
    return;
  }

  // Exchange ICE candidates once connection descriptions are set
  if(pc && pc.currentRemoteDescription){
    const myRole = isCaller ? 'caller' : 'callee';
    const theirSide = myRole==='caller' ? 'callee' : 'caller';
    const theirField = myRole==='caller' ? 'candidatesCallee' : 'candidatesCaller';
    const list = call[theirField] || [];
    for(let i=candidateProgress[theirSide]; i<list.length; i++){
      try{ await pc.addIceCandidate(new RTCIceCandidate(list[i])); }catch(e){}
    }
    candidateProgress[theirSide] = list.length;
  }

  if(call.status==='declined' && isCaller && state.callPhase==='ringing-out'){
    teardownCall('They declined the call.');
  }
}

async function acceptIncomingCall(){
  isCaller = false;
  candidateProgress = {caller:0, callee:0};
  try{
    localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
  }catch(e){
    alert('Could not access your camera/microphone.'); return;
  }
  const call = await sGet(callKey(), true);
  if(!call){ state.callPhase='idle'; render(); return; }

  pc = newPeerConnection('callee');
  localStream.getTracks().forEach(t=> pc.addTrack(t, localStream));
  await pc.setRemoteDescription(new RTCSessionDescription(call.offer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  call.callee = state.myId;
  call.answer = answer;
  call.status = 'active';
  await sSet(callKey(), call, true);

  state.callPhase='active';
  render();
}

async function declineCall(){
  const call = await sGet(callKey(), true);
  if(call){ call.status='declined'; await sSet(callKey(), call, true); }
  state.callPhase='idle'; state.callPeerName=''; render();
}

async function endCall(reason){
  const call = await sGet(callKey(), true);
  if(call){ call.status='ended'; call.endedReason = reason; await sSet(callKey(), call, true); }
  teardownCall(reason);
}

function teardownCall(reason){
  if(pc){ pc.close(); pc=null; }
  if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
  remoteStream = null;
  isCaller=false;
  if(reason){
    state.callPhase='idle';
    state.callPeerName='';
    state.callMuted=false;
    state.callCamOff=false;
    state.callError='';
  }
  render();
}

function toggleCallMic(){
  if(!localStream) return;
  state.callMuted = !state.callMuted;
  localStream.getAudioTracks().forEach(t=> t.enabled = !state.callMuted);
  render();
}
function toggleCallCam(){
  if(!localStream) return;
  state.callCamOff = !state.callCamOff;
  localStream.getVideoTracks().forEach(t=> t.enabled = !state.callCamOff);
  render();
}

/* ================= Boot ================= */
if(!storageAvailable()){
    state.loginError = 'Storage is unavailable in this browser (no storage bridge and no localStorage) — this app cannot run here.';
  state.loginBusy = false;
}
render();

})();
</script>
